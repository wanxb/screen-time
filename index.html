<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>屏幕时间 - 轻量的 Windows 使用时长提醒工具</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5f0;
      --surface: #ffffff;
      --ink: #1d1b18;
      --muted: #635f57;
      --line: #e3ded5;
      --accent: #2f7d52;
      --accent-soft: #e9f4ef;
      --shadow: 0 24px 70px rgba(36, 31, 24, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100vh;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1120px;
      margin: 0 auto;
      padding: 22px 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    .mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 18px;
    }

    .nav-link {
      color: var(--muted);
      font-size: 14px;
    }

    .hero {
      max-width: 1120px;
      margin: 0 auto;
      padding: 48px 28px 76px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.82fr) minmax(420px, 1.18fr);
      gap: 48px;
      align-items: center;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      max-width: 520px;
      margin: 16px 0 18px;
      font-size: 56px;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .lead {
      max-width: 500px;
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      font-weight: 700;
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .shot-wrap {
      position: relative;
    }

    .shot {
      display: block;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .mini-shot {
      position: absolute;
      right: -18px;
      bottom: -34px;
      width: 42%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 18px 42px rgba(36, 31, 24, 0.16);
    }

    .features {
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      max-width: 1120px;
      margin: 0 auto;
      padding: 1px 28px 56px;
    }

    .feature {
      min-height: 150px;
      padding: 28px 22px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .feature strong {
      display: block;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .feature span {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .download {
      max-width: 1120px;
      margin: 0 auto;
      padding: 44px 28px 64px;
    }

    .download-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--accent-soft);
    }

    .download h2 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 0;
    }

    .download p {
      margin: 0;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .hero-grid,
      .feature-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 42px;
      }

      .mini-shot {
        position: static;
        width: 100%;
        margin-top: 14px;
      }

      .download-box {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="nav" aria-label="主导航">
      <a class="brand" href="#">
        <span class="mark">◎</span>
        <span>屏幕时间</span>
      </a>
      <a class="nav-link" href="#download">下载</a>
    </nav>

    <section class="hero">
      <div class="hero-grid">
        <div>
          <div class="eyebrow">Windows 本机统计 · 休息提醒</div>
          <h1>屏幕时间</h1>
          <p class="lead">看清每天的电脑使用节奏，在连续专注太久时收到温和提醒。数据只保存在本机，界面克制，适合长期放在托盘里运行。</p>
          <div class="actions">
            <a class="button primary" href="./ScreenTime.zip" download>下载 Windows 版</a>
            <a class="button" href="README.md">查看文档</a>
          </div>
        </div>
        <div class="shot-wrap">
          <img class="shot" src="src/ScreenTime/Assets/preview_0.png" alt="屏幕时间主界面预览">
          <img class="mini-shot" src="src/ScreenTime/Assets/preview_1.png" alt="屏幕时间设置界面预览">
        </div>
      </div>
    </section>

    <section class="features" aria-label="功能">
      <div class="feature-grid">
        <div class="feature">
          <strong>时长统计</strong>
          <span>按天和周查看活跃使用时长、应用排行和分类占比。</span>
        </div>
        <div class="feature">
          <strong>休息提醒</strong>
          <span>连续使用到达设定时长后，显示全屏倒计时提醒。</span>
        </div>
        <div class="feature">
          <strong>托盘常驻</strong>
          <span>最小化后保持后台运行，可用小猫或小狗动画提示状态。</span>
        </div>
        <div class="feature">
          <strong>本机隐私</strong>
          <span>只记录软件级使用数据，不记录键盘内容、截图或浏览器 URL。</span>
        </div>
      </div>
    </section>

    <section class="download" id="download">
      <div class="download-box">
        <div>
          <h2>开始使用屏幕时间</h2>
          <p>下载压缩包，解压后运行 ScreenTime.exe。</p>
        </div>
        <a class="button primary" href="./ScreenTime.zip" download>下载 Windows 版</a>
      </div>
    </section>
  </main>
</body>
</html>
